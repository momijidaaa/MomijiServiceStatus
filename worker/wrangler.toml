name = "momiji-status-worker"
main = "src/index.js"
compatibility_date = "2024-11-01"

[triggers]
crons = ["*/1 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "momiji-status"
database_id = "52eacfda-0936-4448-b214-e719a7a9c46b"

[vars]
CHECK_TIMEOUT_MS = "10000"
DATA_RETENTION_DAYS = "60"
ALLOWED_ORIGIN = "https://status.momijiweb.jp"

[env.production]
name = "momiji-status-worker"

[env.production.vars]
CHECK_TIMEOUT_MS = "10000"
DATA_RETENTION_DAYS = "60"
ALLOWED_ORIGIN = "https://status.momijiweb.jp"

[[env.production.d1_databases]]
binding = "DB"
database_name = "momiji-status"
database_id = "52eacfda-0936-4448-b214-e719a7a9c46b"
